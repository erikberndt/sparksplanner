<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Digital Sparks Hours</title>
<meta name="description" content="Monatsplanung und Stunden-Tracking · Digital Sparks, Education Innovation Lab">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sparksplanner.vercel.app/">
<meta property="og:title" content="sparksplanner · Digital Sparks">
<meta property="og:description" content="Monatsplanung und Stunden-Tracking · Okt 2026 – Jan 2027">
<meta property="og:image" content="https://sparksplanner.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://sparksplanner.vercel.app/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>body{margin:0}</style>
</head>
<body class="locked">
<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-h">
  <form class="panel gate-box" id="gate-form" novalidate>
    <div class="eyebrow">Digital Sparks · Planung</div>
    <h2 id="gate-h">Anmelden</h2>
    <label>Name
      <select id="gate-user" name="user" required></select>
    </label>
    <label>Passwort
      <input id="gate-pw" name="password" type="password" autocomplete="current-password" required>
    </label>
    <p class="gate-err" id="gate-err" role="alert"></p>
    <button type="submit" id="gate-btn">Anmelden</button>
  </form>
</div>

<div class="wrap">
  <header>
    <div class="topline">
      <h1 id="title"></h1>
      <div class="who" id="who"></div>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </div>
    <nav class="dtabs" id="dtabs" role="tablist" aria-label="Dashboard wählen"></nav>
  </header>

  <!-- Inhalt je nach Dashboard (app.js → renderPerson / renderKurse) -->
  <main class="dash" id="dash"></main>
</div>

<script src="/plan.js"></script>
<script src="/app.js"></script>
</body>
</html>
